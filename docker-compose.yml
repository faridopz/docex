services:
  # ── FastAPI screener API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      # Live-reload on source changes during development
      - .:/app
    restart: unless-stopped
    healthcheck:
      # Use Python (always present in this image) instead of curl (which is
      # NOT installed). The check passes only if /health returns HTTP 200;
      # urlopen raises on any error, which Docker reads as "unhealthy".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Give the API time to boot before the first check counts against it.
      start_period: 15s

  # ── Next.js frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
