# Railway deployment config for the DOCex API.
#
# Railway autodetects this file at the repo root. Builds from api/Dockerfile,
# runs on a persistent volume so /app data survives restarts.
#
# Required env vars to set in Railway dashboard:
#   ANTHROPIC_API_KEY    — Claude API key
#   PAYSTACK_SECRET_KEY  — Paystack live or test key
#   ALLOWED_ORIGINS      — comma-separated list of frontend origins,
#                          e.g. "https://docex.vercel.app,https://docex.com"
#   ADMIN_SECRET         — optional; locks /admin/diagnostics when set

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
# Railway provides $PORT at runtime; the Dockerfile CMD already respects it.
healthcheckPath = "/health"
# Cold boot imports heavy libs (PyMuPDF, pdfplumber, anthropic) before uvicorn
# can answer /health. 30s was tight enough that a slow cold start could miss the
# window and get rolled back; 300s gives ample margin without masking a real
# crash (a crashed process still fails fast — this only helps genuine slow boots).
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
