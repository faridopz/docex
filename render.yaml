# Render Blueprint for DOCex — production.
#
# WHAT CHANGED, AND WHY IT MATTERS
# This file used to describe a free-tier demo: no database, no persistent disk,
# an instance that slept after fifteen minutes. That was honest for a demo. It
# is not survivable for a client entering real payments, for two reasons that
# are easy to miss because neither shows up as an error:
#
#   1. Data was written to JSON files on the container's local disk, which
#      Render replaces on every deploy. Every requisition, every approval,
#      every user account disappeared each time the code changed — silently,
#      with no error and no warning, because writing a file always succeeds.
#   2. A free web service sleeps and cold-starts in 30-50 seconds. A finance
#      officer meeting a blank screen concludes the system is broken, and they
#      are not wrong to.
#
# So: a managed Postgres, a paid always-on web service, and DOCEX_DATABASE_URL
# wired from one to the other by Render itself.
#
# ─── one-time setup ────────────────────────────────────────────────────────
#
#   1. Push this to `demo-release`.
#   2. Render → New → Blueprint → connect the docex repo. Render creates BOTH
#      the database and the web service and links them.
#   3. Set the secrets marked `sync: false` in the dashboard (they are not in
#      git and must never be):
#
#        ANTHROPIC_API_KEY   the Claude key
#        AUTH_SECRET         signs session tokens. Unset means a random secret
#                            per container: every user is signed out on every
#                            deploy, and two instances never agree on a session.
#        DOCEX_SIGNING_KEY   signs the hash-chained audit log. See the warning.
#        ALLOWED_ORIGINS     the exact frontend origin, e.g.
#                            https://docex-neem.vercel.app  (no trailing slash)
#        SENTRY_DSN          optional, but this is how you hear about a crash
#                            before the client tells you about it.
#
#      Generate the two keys with:
#        python3 -c "import secrets; print(secrets.token_urlsafe(48))"
#
#   4. Store both keys in a password manager BEFORE pasting them into Render.
#
# ⚠️ DOCEX_SIGNING_KEY MUST NEVER BE ROTATED.
#    It signs the append-only audit chain. Change it and verify_audit_chain()
#    fails on every historical record — the immutability guarantee, which is
#    the product's core claim to an auditor, evaporates in one edit. There is
#    no recovery: the old records cannot be re-signed without invalidating the
#    very property the chain exists to prove. Set it once. Keep it for years.
#
# ─── cost ──────────────────────────────────────────────────────────────────
#   Render web (free)      $0   sleeps after 15 min idle; kept warm by workflow
#   Supabase Postgres      $0   500 MB, unlimited requests, pauses only after
#                               SEVEN DAYS of no activity — so daily client use
#                               never pauses it
#   Vercel frontend        $0
#   GitHub Actions backup  $0
#   ───────────────────────────
#   $0/month to launch. See DEPLOYMENT.md for what to upgrade first, and when.
#
# ─── backups ───────────────────────────────────────────────────────────────
#   The free tier has NO provider backups. That gap is covered by
#   .github/workflows/backup.yml: nightly, off this infrastructure, and each
#   one verified by actually restoring it. It produces plain JSON Lines, which
#   is the copy a client's auditor is really asking about — the one readable
#   without the provider and without us.
#
#   Because there is no provider snapshot to fall back on, that workflow is
#   not optional here. Check it is green before the first client payment.

# ─── the database is NOT declared here, on purpose ─────────────────────────
#
# Render's managed Postgres has no free tier. The database therefore lives
# somewhere with one — Supabase today — and arrives as DOCEX_DATABASE_URL, set
# by hand in the dashboard.
#
# That is not a compromise on the thing that matters. Read this next part
# carefully, because it is the whole argument:
#
#   The failure that loses a client is DATA LOSS. It is silent, it is
#   discovered by them, and it is unrecoverable.
#   The failure this free tier actually has is a COLD START — the first
#   request after fifteen idle minutes waits 30-50 seconds.
#
# One of those ends the relationship. The other is embarrassing for under a
# minute, and .github/workflows/keep-warm.yml already pings /health every ten
# minutes so it rarely happens during a working day.
#
# So: free compute, durable external database, our own verified nightly
# backups. Records survive every redeploy. Nothing is being risked that a
# client would notice as a loss.
#
# ─── upgrading, when the first invoice clears ──────────────────────────────
#
#   plan: starter    $7/mo   512MB / 0.5 CPU — no sleeping, no cold starts
#   plan: standard   $25/mo  2GB / 1 CPU     — headroom for bulk document work
#
# Measured on this app: 139 MB baseline, ~250 MB peak while extracting a
# scanned PDF. Starter is comfortable for requisitions and approvals and tight
# for bulk extraction; standard is comfortable for everything.
#
# Change the one word below and redeploy. The database is external, so nothing
# migrates and no data moves. Delete keep-warm.yml at the same time.

services:
  - type: web
    name: docex-api
    runtime: docker
    plan: free
    # Frankfurt, not Oregon. Every request from Lagos crosses the Atlantic
    # twice on a US region; Frankfurt is roughly a third of the round trip.
    # It costs nothing and is the single cheapest latency win available.
    #
    # Put the DATABASE in the same region. An app in Frankfurt talking to a
    # database in Stockholm pays ~20-30ms on every query, and one page load
    # makes many — that is the difference between a screen that feels instant
    # and one that feels tired.
    region: frankfurt
    branch: demo-release
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # THE ONE THAT MATTERS. Without it the app refuses to boot in production
      # (api/main.py), because the alternative is writing records to a disk
      # Render replaces on every deploy — silently, with no error.
      #
      # From Supabase: Project Settings → Database → Connection string → URI.
      # Prefer the SESSION pooler (port 5432) over the transaction pooler
      # (6543); DOCex detects a pooler either way and turns off server-side
      # prepared statements, which transaction poolers cannot support.
      - key: DOCEX_DATABASE_URL
        sync: false

      # Which client this instance serves. Every record is stored under this
      # org id, so changing it hides all existing data rather than migrating
      # it. One instance, one client.
      - key: DOCEX_ORG
        value: neem

      # Keep the pool well under the provider's connection cap, leaving room
      # for a psql session and the nightly backup job. Supabase's free tier is
      # meaner about connections than a dedicated instance, so 5, not 10.
      - key: DOCEX_PG_POOL_MAX
        value: "5"

      - key: DOCEX_ENV
        value: production

      # Secrets — set in the dashboard, never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DOCEX_SIGNING_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
