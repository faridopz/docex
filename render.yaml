# Render Blueprint for the DOCex API (free tier).
#
# One-time setup:
#   1. Push this file to the `demo-release` branch on GitHub.
#   2. Render dashboard → New → Blueprint → connect the docex repo.
#   3. Render reads this file and creates the `docex-api` web service.
#   4. Set the two secret env vars below in the dashboard (they are sync:false
#      so they are NOT stored in git):
#        - ANTHROPIC_API_KEY : your Claude API key
#        - ALLOWED_ORIGINS   : your Vercel frontend URL,
#                              e.g. https://docex.vercel.app
#      (ALLOWED_ORIGINS can be added after Vercel gives you the URL — just
#       redeploy the service once it is set.)
#
# Notes:
#   - Free web services sleep after ~15 min idle and cold-start in ~30-50s.
#     That is fine for a demo. No card required.
#   - The Dockerfile already respects $PORT (Render injects it) and exposes
#     /health, so no start command is needed here.
#   - Free tier has no persistent disk: local files (checks/, rulebooks/…)
#     reset on redeploy. Durable storage comes later on Azure.

services:
  - type: web
    name: docex-api
    runtime: docker
    plan: free
    region: oregon
    branch: demo-release
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
