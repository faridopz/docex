# Keep the Render free-tier API awake.
#
# WHY: Render free web services sleep after ~15 minutes idle and cold-start in
# 30-50 seconds. That wake time is paid by whoever runs the next compliance
# check — it dwarfs every other latency in the system (see PERFORMANCE_AUDIT.md).
# Pinging /health on a schedule keeps the container resident, so the first real
# request of the day is a WARM request.
#
# /health is deliberately trivial (returns a static payload — no Anthropic call,
# no document parsing, no disk work), so this costs essentially nothing.
#
# SETUP: add a repository variable named DOCEX_API_URL pointing at the API root,
# e.g. https://docex-api.onrender.com   (Settings → Secrets and variables →
# Actions → Variables). Without it the job no-ops instead of failing the tab.
#
# NOTE: this is a pragmatic workaround for the free tier, NOT a production
# posture. On a paid/always-on instance (or Azure later) delete this workflow.

name: keep-warm

on:
  schedule:
    # Every 10 minutes — comfortably inside Render's ~15-minute idle window.
    # GitHub may delay scheduled runs under load; 10 min gives us headroom.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.DOCEX_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "DOCEX_API_URL variable is not set — skipping (nothing to warm)."
            exit 0
          fi
          echo "Warming ${API_URL}/health"
          # Generous max-time: a cold start can legitimately take ~50s, and we
          # WANT that request to complete so the instance is left awake.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "${API_URL}/health" || echo "000")
          echo "HTTP ${code}"
          # Don't fail the workflow on a transient blip — a red X every 10
          # minutes is noise, not signal. Log it and move on.
          if [ "$code" != "200" ]; then
            echo "::warning::Health ping returned ${code} (instance may have been asleep or deploying)."
          fi
